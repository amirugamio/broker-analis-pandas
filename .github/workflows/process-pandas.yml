name: Process ownership with pandas

on:
  workflow_dispatch:
  push:
    paths:
      - 'Ringkasan Broker.xlsx'
      - 'peng-lima-persen.xlsx'
      - 'scripts/**'
      - '.github/workflows/process-pandas.yml'
  schedule:
    # 18.00 WIB = 11.00 UTC. This reprocesses the latest manually uploaded source files.
    - cron: '0 11 * * *'

permissions:
  contents: write

concurrency:
  group: idx-ownership-pipeline
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas openpyxl
      - name: Validate manual source files
        run: |
          test -s 'Ringkasan Broker.xlsx' || (echo 'File Ringkasan Broker.xlsx tidak ditemukan/kosong.' && exit 1)
          test -s 'peng-lima-persen.xlsx' || (echo 'File peng-lima-persen.xlsx tidak ditemukan/kosong.' && exit 1)
      - name: Run pandas processing
        run: python scripts/proses_broker.py
      - name: Export dashboard JSON
        run: python scripts/export_json.py
      - name: Commit generated JSON only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ownership.json
          git diff --cached --quiet || git commit -m 'Update ownership JSON from manually uploaded IDX files'
          git push
