name: Download IDX and process ownership

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/process-pandas.yml'
  schedule:
    # 18.00 WIB = 11.00 UTC, every day (the script falls back to the latest available IDX data).
    - cron: '0 11 * * *'

permissions:
  contents: write

concurrency:
  group: idx-ownership-pipeline
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas openpyxl curl_cffi
      - name: Download latest source files from IDX
        run: python scripts/download_idx.py
      - name: Run pandas processing
        run: python scripts/proses_broker.py
      - name: Export dashboard JSON
        run: python scripts/export_json.py
      - name: Commit only generated JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ownership.json
          git diff --cached --quiet || git commit -m 'Update IDX ownership data'
          git push
