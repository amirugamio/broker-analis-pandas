name: Download IDX and process ownership with pandas

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/process-pandas.yml'
  schedule:
    # 04:30 UTC = 11:30 WIB, weekdays
    - cron: '30 4 * * 1-5'

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas openpyxl requests
      - name: Download latest source files from IDX
        run: python scripts/download_idx_sources.py
      - name: Run pandas calculation
        run: python scripts/proses_broker.py
      - name: Export result to JSON
        run: python scripts/export_json.py
      - name: Commit generated JSON only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ownership.json
          git diff --cached --quiet || git commit -m 'Update ownership data from IDX'
          git push
